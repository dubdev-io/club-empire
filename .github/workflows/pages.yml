# Publish the static build so it can be opened on a phone (DUB-9).
#
# The whole point of this file is DUB-8: the frame rate gets measured on the
# owner's own iPhone in Safari, and that needs a URL rather than a dev server on
# someone's laptop. Nothing here costs money — GitHub Pages and GitHub-hosted
# runners only.
#
# Pages history on this repo, because it changed under this ticket:
#
# When the workflow was first committed, Pages was refused —
#
#   POST /repos/dubdev-io/club-empire/pages  ->  HTTP 422
#   {"message":"Your current plan does not support GitHub Pages for this
#    repository.", "status":"422"}
#
# — because the repo was private and the org's plan allows Pages on public
# repos only. The repo has since been made public (not by this ticket; changing
# visibility was explicitly out of scope), the same call now returns 201, and
# the site is live at https://dubdev-io.github.io/club-empire/.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Pre-merge preview. `main` is still the empty initial commit — the whole
      # game sits in a stack of open PRs (DUB-3 -> DUB-4 -> DUB-5 -> DUB-9) —
      # so deploying `main` today publishes nothing, and DUB-8 cannot start
      # without a URL on a phone. This branch is therefore deployed directly so
      # the owner has something to open.
      #
      # **Remove this line when the stack merges.** It exists so a measurement
      # can happen before the review finishes, not as a permanent second
      # deploy source. The `github-pages` environment needs a matching
      # deployment branch policy for it to run at all.
      - DUB-9-debug-overlay
  # So a deploy can be kicked off by hand without waiting for the next commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the build input and
      # a deploy that quietly resolves a different dependency tree than the one
      # that was reviewed is not a reproducible build.
      - run: npm ci

      # The gate is the same one the README states: typecheck, tests, build.
      # A published URL that the owner opens on a phone is the most expensive
      # possible place to discover a type error.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
